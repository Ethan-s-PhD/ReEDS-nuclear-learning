# Analysis environment for the nuclear-learning paper (notebooks under z-ethan/notebooks).
# Exact pins of the environment that produced the paper's results (conda env "playground-env",
# Windows, 2026-09-25). Packages that environment installed with pip are pinned under `pip:`,
# so the same wheels are used. Create with:
#     conda env create -f z-ethan/environment.yml
#     conda activate nuclear-learning-analysis
#     python -m pip install --force-reinstall --no-deps numpy==1.26.4
# The last line matters: the results were produced with the PyPI wheel of numpy 1.26.4 (installed
# over the conda package), and conda-forge's build of the same version differs in the last bit of
# some elementary functions. With the PyPI wheel a clean run reproduces results/ byte for byte.
# numexpr and bottleneck are pinned because pandas uses them, when present, for some
# arithmetic and nan-reductions; a different version can change the last digits of a result.
# numba, scikit-learn, seaborn, h5py and pyarrow are not imported by any notebook of this kit; they
# are kept so the environment matches the one that produced the results.
name: nuclear-learning-analysis
channels:
  - conda-forge
dependencies:
  - python=3.12.3
  - numpy=1.26.4
  - pandas=2.2.2
  - matplotlib=3.8.4
  - pillow=10.4.0
  - cycler=0.11.0
  - numexpr=2.8.7
  - bottleneck=1.3.7
  - ipython=8.26.0
  - ipykernel=6.29.5
  - jupyter_client=8.6.2
  - jupyter_core=5.7.2
  - nbclient=0.10.4
  - nbconvert=7.17.0
  - nbformat=5.10.4
  - notebook>=7          # interactive UI only; notebooks are executed with nbconvert
  - pip
  - pip:
      - scipy==1.14.1
      - h5py==3.16.0
      - pyarrow==24.0.0
      - scikit-learn==1.8.0
      - seaborn==0.13.2
      - numba==0.65.1
      - llvmlite==0.47.0
      - threadpoolctl==3.6.0
      - joblib==1.4.2
      - tqdm==4.66.6
      - openpyxl==3.1.5
