<script>
"use strict";
/* ---------- data and state ---------- */
let C = null, S2 = null, S2P = null, CUR = null, BY = {};
const EXTRA = {}, EXTRAP = {};   // lazily loaded page data: markets.json, cendiv.json
const TORDER = ["eia", "aj", "iaea", "mck", "cop28", "eo"];
const ORDER = ["electricity consumers", "non-power gas consumers", "taxpayers", "owners: SMR (new)", "owners: gas",
  "owners: wind + solar", "owners: existing nuclear", "owners: coal", "owners: hydro", "owners: storage",
  "owners: H2 and DAC production", "owners: other", "gas producers", "network", "foreign buyers", "foreign sellers: Canadian imports"];
const REF = { target: "eo", horizon: "A", rate: "2.0%", support_form: "lump", funding: "T", allowance_national: "free",
  allowance_state: "free", basis: "global EPA2023 2.0%", health: "AP2 ACS", mcpf: 1, phi: 0 };
const VIEWKEYS = ["horizon", "support_form", "funding", "allowance_national", "allowance_state", "basis", "health", "mcpf", "phi", "rate"];
const S = Object.assign({}, REF, { metric: "view2", annualActor: "taxpayers", level: "energy_price_per_MWh", rpsCase: "eo",
  varStage: "1", s2bTarget: "eo", mkSet: "1|reference", mkMeasure: "gen_share", mkSeries: "gen_share", mkGroup: "existing nuclear",
  cdSet: "1|reference", cdActor: "electricity consumers", cdDiv: "South_Atlantic", cdGas: "CO2" });
try { const saved = JSON.parse(localStorage.getItem("agreview.state") || "{}"); for (const k in saved) if (k in S) S[k] = saved[k]; } catch (e) {}
function saveState() { try { localStorage.setItem("agreview.state", JSON.stringify(S)); } catch (e) {} }

const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; e.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return e;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mdl = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
const fmt = v => (v == null || !isFinite(v)) ? "–" : (Math.abs(v) >= 100 ? d3.format(",.0f")(v) : Math.abs(v) >= 10 ? d3.format(".1f")(v) : d3.format(".2f")(v));
const fmtS = v => (v == null || !isFinite(v)) ? "–" : ((v > 0 ? "+" : "") + fmt(v));
const fmtAxis = v => Math.abs(v) >= 1000 ? d3.format(",.0f")(v) : d3.format("~g")(v);
const pct = (v, d = 3) => (v == null || !isFinite(v)) ? "–" : d3.format(`.${d}~f`)(v * 100) + "%";
const sci = v => (v == null || !isFinite(v)) ? "–" : (Math.abs(v) < 1e-3 && v !== 0 ? d3.format(".1e")(v).replace("e", "×10^") : d3.format(".4~f")(v));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const median = a => d3.median(a.filter(v => v != null && isFinite(v)));

/* ---------- labels ---------- */
const BASIS_LABEL = b => ({ "global EPA2023 1.5%": "Global, EPA 2023, 1.5%", "global EPA2023 2.0%": "Global, EPA 2023, 2.0%",
  "global EPA2023 2.5%": "Global, EPA 2023, 2.5%", "domestic EPA2019 3%": "Domestic, EPA 2019 interim, 3%",
  "domestic EPA2019 7%": "Domestic, EPA 2019 interim, 7%" }[b] || b);
const HEALTH_LABEL = v => v.replace(" ", " · ");
const TLABEL = t => { const s = C.schedules.find(x => x.schedule === t); return s ? `${t} — ${s.source}, ${d3.format(".0f")(s.fleet_target_2050_GW)} GW fleet in 2050` : t; };
const CONDLABEL = c => (C.conditions.find(x => x.condition === c) || {}).label || c;
const CONDS = ["gaslo", "gashi", "demhi", "relo", "rehi", "translim"];
const METRICS = () => [["view1", "View 1 (consumers + taxpayers)"], ["view2", "View 2 (all US residents)"],
  ["env_ghg", "Environment: greenhouse gases"], ["env_health", "Environment: health (NOx, SO2)"],
  ...ORDER.filter(a => C.actors.includes(a)).map(a => ["a:" + a, a])];
const metricLabel = m => (METRICS().find(x => x[0] === m) || [m, m])[1];

/* ---------- ledger arithmetic (mirrors notebook 25 §2) ---------- */
const MK = ["horizon", "support_form", "funding", "allowance_national", "allowance_state"];
function keyFor(run, st) {
  const k = {}; MK.forEach(m => k[m] = st[m]);
  const tries = [k, { ...k, allowance_national: "none" }, { ...k, support_form: "none", funding: "none" },
    { ...k, support_form: "none", funding: "none", allowance_national: "none" }];
  for (const t of tries) { const s = MK.map(m => t[m]).join("|"); if (run.actors[s]) return s; }
  return null;
}
function actorV(run, actor, st) {
  const k = keyFor(run, st); if (!k) return null;
  const v = run.actors[k][C.const.rates.indexOf(st.rate)][C.actors.indexOf(actor)];
  return v == null ? 0 : v;
}
function viewParts(run, st) {
  const k = keyFor(run, st); if (!k) return null;
  const b = C.const.bases.indexOf(st.basis);
  const [v1m, tax, pi, fo] = run.vm[k][b];
  const hp = run.vh[st.horizon];
  const ghg = hp.ghg[b], hl = hp.health[b][C.const.health.indexOf(st.health)], scres = hp.scres[b];
  const dw = (st.mcpf - 1) * tax;

const NOGLOSS = ".eq, svg, code, select, option, label, button, h1, h2, h3, th, dt, summary, .pill, .eyebrow, .chips, .fig-no, .ctrl-state";
const glossKey = g => g.toLowerCase().replace(/^(the|an?|us|eia's|new york's) /, "").split(" ").slice(0, 2).join(" ");
function glossPage(root) {
  const nodes = [], w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT,
    { acceptNode: n => n.parentElement && !n.parentElement.closest(NOGLOSS) && /\S/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  while (w.nextNode()) nodes.push(w.currentNode);
  const around = (i, k) => (nodes[i + k] ? nodes[i + k].nodeValue : "");
  for (const [tok, g, gp, ahead] of GLOSS) {
    const re = new RegExp(`(^|[^\\w-])(${tok.replace(/-/g, "\\-")})(s?)(?![\\w-])${ahead ? `(?=${ahead})` : ""}`);
    const key = glossKey(g);
    scan: for (let i = 0; i < nodes.length; i++) {
      const v = nodes[i].nodeValue;
      const rg = new RegExp(re.source, "g");
      let m;
      while ((m = rg.exec(v))) {
        const at = m.index + m[1].length, end = at + m[2].length + m[3].length;
        const before = (around(i, -1).slice(-140) + v.slice(0, at)).toLowerCase(), after = v.slice(end) + around(i, 1).slice(0, 140);
        if (/^['’]s(?![a-z])/.test(after)) continue;   // a possessive cannot carry a gloss; use the next plain use
        const glossed = /^\s*\(/.test(after) || before.slice(-140).includes(key) || after.toLowerCase().slice(0, 140).includes(key);
        if (!glossed) nodes[i].nodeValue = v.slice(0, end) + ` (${m[3] && gp ? gp : g})` + v.slice(end);
        break scan;
      }
    }
  }
}

  const s1 = [], s1b = [];

}

    ["Gas producers", "Profit change = Δ[p_gas × (Q_power + Q_np + Q_exp)] − Δ objective gas cost.", "repgasprice_nat, repgasquant_nat, gascost_cendiv"],

    ["Foreign buyers", "The energy part of exports to Canada and the gas-export price change: −X − Δp_gas × Q_exp (A10). Outside the US ledger.", "revenue (can-imports), expenditure_flow_int; AEO Table 13"],

function pVariants(el) {
  header(el, "Results", "Variant sensitivity",
    "Each open accounting choice moves the views by a different amount. This page changes one key at a time from the reference variant and shows how far View 1 and View 2 move.");
  controls(el, [["target", "varStage"]]);
  const base = { ...REF, target: S.target };
  const changes = variantChanges(S.varStage === "2c");
  const runs = S.varStage === "1" ? [S1(S.target)] : BY[S.varStage].filter(r => r.target === S.target);
  const d = (st, v) => median(runs.map(r => viewParts(r, st)[v] - viewParts(r, base)[v]));
  const ref1 = median(runs.map(r => viewParts(r, base).v1)), ref2 = median(runs.map(r => viewParts(r, base).v2));
  const f = fig(el, `One key at a time — ${S.target}`,
    `This figure shows the change in View 1 and View 2 when one key changes from the reference variant and all other keys stay at the reference. Each bar is the new value minus the reference value. For stages 2a and 2c, each bar is the median over the runs of the change in each run. A row of zeros in View 2 is a change that only moves money between US residents, because View 2 starts from the resource cost. Reference values: View 1 ${fmtS(ref1)}, View 2 ${fmtS(ref2)} (2025 $B, PV to 2026). A change of carbon value also changes the discount rate of the views, because each carbon value has its own rate. The selectors of other pages do not apply here.`);
  const g = h("div", { class: "grid2" }); f.body.append(g);
  const r1 = changes.map(([l, c]) => ({ label: l, value: d({ ...base, ...c }, "v1") })), r2 = changes.map(([l, c]) => ({ label: l, value: d({ ...base, ...c }, "v2") }));
  const dom = [Math.min(0, ...r1.map(r => r.value), ...r2.map(r => r.value)), Math.max(0, ...r1.map(r => r.value), ...r2.map(r => r.value))];
  const c1 = h("div", {}, h("div", { class: "note" }, "Δ View 1")), c2 = h("div", {}, h("div", { class: "note" }, "Δ View 2")); g.append(c1, c2);
  divBars(c1, r1, { labelW: 190, domain: dom }); divBars(c2, r2, { labelW: 190, domain: dom });
  const all = TORDER.map(t => { const rr = S.varStage === "1" ? [S1(t)] : BY[S.varStage].filter(r => r.target === t); const b = { ...REF };
    return { t, ...Object.fromEntries(changes.map(([l, c]) => [l, median(rr.map(r => viewParts(r, { ...b, ...c }).v2 - viewParts(r, b).v2))])) }; });
  el.append(table([{ h: "Change from reference", k: "l" }, ...TORDER.map(t => ({ h: t, k: t, num: true, f: fmtS, sign: true }))],
    changes.map(([l]) => ({ l, ...Object.fromEntries(all.map(a => [a.t, a[l]])) })), { cap: "Δ View 2 for every target (2025 $B, PV to 2026)." }));
}

  el.append(h("div", { class: "prose" }, h("ul", {},
    h("li", { html: `<b>Renewable portfolio standard (RPS).</b> A state law that requires electricity retailers to get a set share of their sales from renewable sources. A <b>clean energy standard (CES)</b> is the same rule with a wider list of eligible sources, which can include nuclear and large hydro.` }),
    h("li", { html: `<b>Load-serving entity (LSE).</b> The utility or retail supplier that sells electricity to end users. The LSE carries the legal obligation and passes the cost to its customers.` }),
    h("li", { html: `<b>Renewable energy credit (REC).</b> A certificate for each MWh of eligible generation. The LSE shows compliance by retiring RECs. An <b>unbundled</b> REC is sold alone. A <b>bundled</b> REC is sold together with electricity that flows to the buyer.` }),
    h("li", { html: `<b>Alternative compliance payment (ACP).</b> A fixed price per MWh that an LSE can pay to the state instead of retiring a REC. It works like a price ceiling.` }),

  el.append(h("p", { html: `The level matters for the consumers' payment line. The ledger, however, reports changes, so only the policy run minus the baseline enters it. For target eo the change is ${fmtS(atYr(E, "gap", 2050) - atYr(B0, "gap", 2050))} in 2050. As a PV in 2025 $B at 2.0%, the change is ${rngOf(TORDER.map(t => P[t].A.gap), fmtS)} under horizon A and ${rngOf(TORDER.map(t => P[t].B.gap), fmtS)} under horizon B, depending on the target. The sign differs by target: the mandate raises the gap for some targets and lowers it for others. The largest stage-1 actor entry at the reference variant is ${fmt(big)} 2025 $B, so the change is small. No actor in the ledger receives it.` }));

  el.append(h("div", { class: "panel" }, h("h3", {}, "(a) The interstate price wedge: the main term"), h("div", { class: "prose" }, h("ul", {},
    h("li", { html: `<b>What it is.</b> A REC sold from State S to a retailer in State B is charged to State B's consumers at State B's price, because that price is the marginal cost of compliance in State B. The revenue report pays the seller State S's price. The difference per REC is the wedge (Figure ${PAGENO}.1).` }),
    h("li", { html: `<b>Size.</b> RECs traded between states × (buyer-state price − seller-state price). For eo in 2050 it is ${f2d(atYr(E, "trade_wedge", 2050))} a year, more than the whole gap of ${f2d(atYr(E, "gap", 2050))}. Term (b) offsets part of it.` }),
    h("li", { html: `<b>Why the prices can differ.</b> If any REC could move freely between the two states, buyers in State B would buy from State S until the two prices met. Published sources say the same (below). In ReEDS the prices stay apart for three reasons (Figure ${PAGENO}.3):
      <ol>

        <li><b>A double count in ReEDS</b> (${pct("double_count")}). <code>eq_REC_Generation</code> takes each export out of the selling state's credit supply. <code>eq_REC_Requirement</code> then subtracts the same export again from the RECs that count toward that state's own requirement. Neither term stands for the exported electricity: the requirement depends on the state's own load, not on its exports. An export therefore costs the seller two RECs of compliance. At the model's optimum the buyer's price is then about twice the seller's or more. This part is a model error. The equation is in NREL's code; the nuclear-learning changes did not touch it.</li>

    h("li", { html: `<b>What it is.</b> Buyers get slightly <i>more</i> credits than the reported requirement, so (b) is negative and reduces the gap. It has two sources. (1) <b>Exports to Canada.</b> In states with a CES, the model treats electricity exported to Canada as clean and makes those states retire credits to cover the exports (<code>eq_REC_Requirement</code> in <code>reeds/core/setup/c_model.gms</code>). The reported requirement excludes the exports, but the credits bought include them. (2) <b>ACP.</b> In the early years (2026–2032) some states meet part of their requirement with ACP instead of RECs. The ledger already gives ACP money to state governments, inside taxpayers.` }),

  el.append(h("h2", {}, "How an interstate REC sale works in practice"));
  el.append(h("p", { class: "note" }, "This section is Claude's general background (2026-11-03). Claude did not check it against sources, so the page cites none here. Prof. Davies is asked to confirm or correct it (question 2 below)."));
  el.append(h("div", { class: "prose" }, h("ul", {},
    h("li", { html: `<b>No state REC exchange sets a price.</b> A generator registers with a regional <b>tracking system</b> (a registry, for example WREGIS in the West or PJM-GATS in the mid-Atlantic). The registry issues one REC for each MWh of output and records each transfer and retirement. It records no price.` }),

    h("li", { html: `<b>Prices of the same eligible REC.</b> Where a REC is equally eligible in two states, the sources say that arbitrage gives it one price. Lasting price gaps separate pools of RECs with <i>different</i> eligibility. LBNL describes regional markets that form around a common pool of eligible supply, with lower prices in the states that have looser eligibility rules ${S_(1)}. Perez et al. model two states with free REC trade and find one REC price; prices differ only when trade or transmission is restricted. Their state REC prices are the shadow prices of the state rules, as in ReEDS ${S_(4)}. EPA describes distinct state compliance markets with different REC prices, in which the owner of a high-value REC can sell it and keep the difference ${S_(5)}.` }),

// one RPS-residual decision card per origin of the trade wedge: how much it moves, and what each option does to the views
function rpsOriginCard(card, k, name, opts, extra = "") {
  const P = C.rps_pv, ph = C.const.phi.filter(p => p > 0), v = (t, hz) => P[t][hz]["w_" + k];
  const f = fig(card, `How much ${name} moves`,
    `The bars show the change in the part of the trade wedge that comes from ${name}, policy run − <code>fbR_none</code>, for the stage-1 P50 run of each target (horizon A). The table gives both horizons and what each option would do to the views. Moving the amount to a domestic owner group leaves View 1 unchanged, because View 1 holds no profits. It changes View 2 only through the foreign-owned share: −φ × the amount, which is zero at φ = 0. Giving the amount back to consumers lowers their RPS payments, so View 1 rises by the amount; View 2 starts from the resource cost, so it does not change. ${extra}2025 $B, PV to 2026 at 2.0%. Source: <code>exports/25/fig_rps_wedge_origin_delta_pv.csv</code> (notebook 25 §4).`);
  divBars(f.body, TORDER.map(t => ({ label: t, value: v(t, "A") })), { labelW: 48, unit: "2025 $B, PV to 2026", aria: `Change in the wedge from ${name}` });
  const cols = [{ h: "Target", k: "t" }, { h: "Δ amount, A", k: r => v(r.t, "A"), num: true, f: fmtS, sign: true }, { h: "Δ amount, B", k: r => v(r.t, "B"), num: true, f: fmtS, sign: true }];
  opts.forEach(([, lab, view]) => {
    if (view === "v1") cols.push({ h: `${lab}: Δ V1, A`, k: r => v(r.t, "A"), num: true, f: fmtS, sign: true });
    else ph.forEach(p => cols.push({ h: `${lab}: Δ V2, A, φ ${p}`, k: r => -p * v(r.t, "A"), num: true, f: fmtS, sign: true }));
  });
  f.body.append(table(cols, TORDER.map(t => ({ t })), { cap: "Δ amount: the change in this part of the wedge. Option columns: the change in View 1 (V1) or View 2 (V2) under horizon A if the amount goes to the named actor. Option “Leave it unassigned” changes no view. Columns not shown are zero." }));
}

// schematic only: the SMR fleet that the mandate requires, by year, in the archived runs and in RUN-1
function diagRuns() {
  const W = 660, H = 270, L = 64, R = 150, T = 18, B = 44;
  const x = d3.scaleLinear([2030, 2055], [L, W - R]), y = d3.scaleLinear([0, 1.35], [H - B, T]);
  const line = pts => pts.map(([a, b], i) => `${i ? "L" : "M"}${x(a).toFixed(1)},${y(b).toFixed(1)}`).join("");
  const base = [[2030, 0], [2035, 0.12], [2041, 0.42], [2050, 1]];
  const paths = [
    { d: line(base), c: "currentColor", w: 2.5, lab: "archived P50 runs (end 2050)", ly: 1 },
    { d: line([[2050, 1], [2055, 1]]), c: "currentColor", w: 2, dash: "5 4", lab: "extended runs: mandate flat", ly: 0.93 },
    { d: line([[2050, 1], [2055, 1 + 5 * (1 - 0.42) / 9]]), c: "var(--s1)", w: 2.5, lab: "RUN-1: same growth to 2055", ly: 1.32 }];
  let s = `<svg viewBox="0 0 ${W} ${H}" style="min-width:520px" role="img" aria-label="Schematic, not data. The archived P50 runs reach the 2050 SMR fleet and stop. The extended runs hold the fleet flat to 2055. RUN-1 keeps the 2041 to 2050 growth going to 2055.">`;
  s += `<line x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}" stroke="currentColor" opacity=".5"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H - B}" stroke="currentColor" opacity=".5"/>`;
  [2030, 2035, 2040, 2045, 2050, 2055].forEach(t => { s += `<text x="${x(t)}" y="${H - B + 16}" text-anchor="middle" font-size="11" fill="currentColor">${t}</text>`; });
  s += `<text x="${L - 8}" y="${y(1) + 4}" text-anchor="end" font-size="11" fill="currentColor">2050 fleet</text><text x="${L - 8}" y="${y(0) + 4}" text-anchor="end" font-size="11" fill="currentColor">0</text>`;
  s += `<line x1="${L}" y1="${y(1)}" x2="${x(2050)}" y2="${y(1)}" stroke="currentColor" opacity=".18" stroke-dasharray="2 3"/>`;
  paths.forEach(q => { s += `<path d="${q.d}" fill="none" stroke="${q.c}" stroke-width="${q.w}"${q.dash ? ` stroke-dasharray="${q.dash}"` : ""} stroke-linejoin="round"/>`; });
  [["currentColor", "archived runs", y(1) - 10, null], ["currentColor", "extended, flat", y(1) + 14, "5 4"], ["var(--s1)", "RUN-1", y(1 + 5 * 0.58 / 9) - 2, null]]
    .forEach(([c, t, yy, dash]) => { s += `<line x1="${W - R + 8}" y1="${yy - 4}" x2="${W - R + 22}" y2="${yy - 4}" stroke="${c}" stroke-width="2.5"${dash ? ` stroke-dasharray="${dash}"` : ""}/><text x="${W - R + 26}" y="${yy}" font-size="11" fill="currentColor">${t}</text>`; });
  s += `<text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">Schematic of the SMR fleet that the mandate requires. Shapes are illustrative, not run data.</text>`;
  return s + "</svg>";
}

  el.append(h("h2", {}, "RUN-2: dropped"));

async function initCaps() {
  if (!window.claude?.use) { ME.ready = true; return; }
  try { USER = await window.claude.use("user"); if (USER) { ME.owner = await USER.isOwner(); ME.id = await USER.id(); } } catch (e) { USER = null; }
  try { DB = await window.claude.use("db"); } catch (e) { DB = null; }
  ME.ready = true;
  if (DB) {
    DB.collection("decisions").onSnapshot(snap => { DEC = {}; snap.docs.forEach(d => { DEC[d.id] = d.data(); }); if (CUR && CUR.id === "decisions") rerender(); },
      err => { DBERR = err.code; if (CUR && CUR.id === "decisions") rerender(); });
  }
  if (CUR && CUR.id === "decisions") rerender();
}
function pDecisions(el) {
  header(el, "Decide", "Decisions",
    "These items are open. Each card gives the context, the options and who decides. Where a choice changes existing results, the card has a figure of how much. Ethan records one decision per item during the meeting. The recorded choice then shows on the card for every viewer.");
  const canWrite = !!DB && ME.owner;
  if (!ME.ready) el.append(h("p", { class: "note" }, "Connecting to the decision record…"));
  else if (!DB) el.append(h("div", { class: "banner" }, "The decision record is not available in this view. The cards show the options only. Open the page on claude.ai to see or record decisions."));
  else if (!ME.owner) el.append(h("p", { class: "note" }, "Only the page owner records decisions. You see the recorded choices."));
  if (DBERR) el.append(h("div", { class: "banner" }, "The decision record stopped updating (" + DBERR + "). Reload the page."));
  const ids = [];
  DECISIONS().forEach((d, i) => {
    const rec = DEC[d.id];
    const dr = DRAFT[d.id] || (DRAFT[d.id] = { choice: rec?.choice ?? d.def, sub: { ...(rec?.sub || {}) }, note: rec?.note || "", editing: !rec });
    const card = h("div", { class: "dcard" + (rec ? " recorded" : "") });
    el.append(card);   // in the DOM before its figures are drawn, so the charts can measure their width
    card.append(h("div", { class: "dhead" }, h("h2", {}, `${i + 1}. ${d.title}`),
      h("div", { class: "dmeta" }, h("span", { class: "pill wait" }, "decides: " + d.who), d.raised ? h("span", { class: "pill wait" }, "raised by Claude") : null,
        rec ? h("span", { class: "pill done" }, "recorded") : h("span", { class: "pill open" }, "open"))));
    card.append(h("p", { html: d.ctx }));
    if (DFIG[d.id]) DFIG[d.id](card); else card.append(h("p", { class: "note" }, NOFIG));
    if (rec && !(canWrite && dr.editing)) {
      const optLab = d.options ? (d.options.find(o => o[0] === rec.choice) || [0, rec.choice])[1] : null;
      const by = h("span", { class: "muted", "data-uid": rec.by || "" }, "");
      ids.push(rec.by);
      card.append(h("div", { class: "recbox" },
        optLab ? h("div", {}, h("b", {}, "Recorded: "), optLab) : null,
        d.sub ? h("div", {}, d.sub.map(([k, lab]) => rec.sub?.[k] ? h("div", {}, h("b", {}, lab + ": "), rec.sub[k]) : null)) : null,
        rec.note ? h("div", {}, h("b", {}, "Note: "), rec.note) : null,
        h("div", { class: "note" }, "Recorded ", rec.at ? new Date(rec.at).toLocaleString() : "", " ", by)));
      if (canWrite) card.append(h("div", { class: "dactions" }, h("button", { onclick: () => { dr.editing = true; rerender(); } }, "Change this decision")));
    } else {
      if (d.options) card.append(h("div", { class: "opts", role: "radiogroup", "aria-label": d.title }, d.options.map(([v, lab, desc]) => {
        const id = `opt-${d.id}-${v}`;
        const inp = h("input", { type: "radio", name: "r-" + d.id, id, value: v, disabled: !canWrite });
        inp.checked = dr.choice === v; inp.addEventListener("change", () => { dr.choice = v; });
        return h("label", { class: "opt", for: id }, inp, h("span", {}, lab, d.def === v ? h("span", { class: "muted" }, " (current default)") : null, desc ? h("div", { class: "od" }, desc) : null));
      })));
      if (d.sub) card.append(h("div", { class: "subgrid" }, d.sub.map(([k, lab, opts]) => {
        const id = `sub-${d.id}-${k}`;
        const s = h("select", { id, disabled: !canWrite }, h("option", { value: "" }, "— not decided —"), opts.map(o => h("option", { value: o }, o)));
        s.value = dr.sub[k] || ""; s.addEventListener("change", () => { dr.sub[k] = s.value; });
        return h("div", { class: "ctrl" }, h("label", { for: id }, lab), s);
      })));
      if (canWrite) {
        const ta = h("textarea", { id: "note-" + d.id, placeholder: "Note: reasons, who agreed, follow-up" }); ta.value = dr.note; ta.addEventListener("input", () => { dr.note = ta.value; });
        const msg = h("span", { class: "note" }, "");
        const btn = h("button", { class: "primary", onclick: async () => {
          if (d.options && !dr.choice) { msg.textContent = "Choose an option first."; return; }
          btn.disabled = true; msg.textContent = "Saving…";
          try {
            await DB.doc("decisions/" + d.id).set({ choice: dr.choice || null, sub: dr.sub, note: dr.note.trim(), by: ME.id, at: new Date().toISOString() });
            dr.editing = false; msg.textContent = "Recorded.";
          } catch (e) { btn.disabled = false; msg.textContent = e.code === "invalid_argument" ? "You cannot record decisions on this page." : "Not saved (" + (e.code || e.message) + "). Try again."; }
        } }, rec ? "Record the new decision" : "Record decision");
        card.append(h("div", { class: "ctrl" }, h("label", { for: "note-" + d.id }, "Note"), ta), h("div", { class: "dactions" }, btn,
          rec ? h("button", { onclick: () => { dr.editing = false; rerender(); } }, "Cancel") : null, msg));
      }
    }
  });
  if (USER && ids.filter(Boolean).length) USER.profiles(ids.filter(Boolean)).then(ps => {
    el.querySelectorAll("[data-uid]").forEach(s => { const p = ps[s.dataset.uid]; if (p) s.textContent = "by " + (p.name || "the owner"); });
  });
}
